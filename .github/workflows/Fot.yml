name: Update Playlist

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches history to prevent push rejections

      - name: Download Full Playlist
        run: |
          # Download the entire original playlist and save it directly as liv.m3u
          curl -s -o liv.m3u "https://clarity-tv.vercel.app/api/playlist/?id=ALLINONE"
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add the full playlist file to the commit
          git add liv.m3u
          
          # Commit the changes only if there are updates
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update liv.m3u with full playlist"
          
          # Safely pull any new remote changes first, then push
          git pull --rebase origin main
          git push
